server:
  port: 8083

spring:
  application:
    name: game-service

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-shared-by-gateway-and-user-service}

internal:
  api-key: ${INTERNAL_API_KEY:dev-internal-key-change-in-prod}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

game:
  reconexion:
    timeout-segundos: ${RECONEXION_TIMEOUT_SEGUNDOS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  config: classpath:logback-spring.xml
